# Example agents. Replace BASE_IMAGE/command with your real agent images.
#
# Hard rules for every service (do not relax):
#   - never mount /var/run/docker.sock
#   - never set privileged: true
#   - never use network_mode: host (it bypasses the DOCKER-USER metadata block)
#
# Every agent image is built through wrapper/Dockerfile, which creates /data
# owned by 1000:1000; the named volume inherits that owner on first use.

# Shared hardening; each service merges it with `<<: *agent`.
x-agent: &agent
  build:
    context: ./wrapper
    args:
      BASE_IMAGE: busybox:1.36 # pin your agent image (tag or @sha256 digest)
  command: ["sh", "-c", "while true; do sleep 3600; done"]
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 300m
  cpus: 0.5
  pids_limit: 100
  restart: unless-stopped

services:
  agent-a:
    <<: *agent
    image: agents/agent-a:local
    env_file: ./secrets/agent-a.env
    volumes:
      - agent-a-data:/data
    networks:
      - agent-a-net

  agent-b:
    <<: *agent
    image: agents/agent-b:local
    env_file: ./secrets/agent-b.env
    volumes:
      - agent-b-data:/data
    networks:
      - agent-b-net

  # bbgo for manual runs: the container idles, and you `exec` in to run bbgo.
  # The base image is built on a Mac and loaded with `docker load` (see README).
  # Start it alone with `docker compose up -d --build bbgo`.
  bbgo:
    <<: *agent
    build:
      context: ./wrapper
      args:
        BASE_IMAGE: bbgo:d5a781c5e # must match the tag loaded onto the VM
    image: agents/bbgo:local
    # The image's ENTRYPOINT is bbgo itself; replace it with an idle loop.
    entrypoint: ["sh", "-c", "while true; do sleep 3600; done"]
    command: [] # drop the shared idle command, which would become entrypoint args
    # Root fs is read-only, so relative paths in the config
    # (e.g. persistence.json.directory: var/data) must resolve on the volume.
    working_dir: /data
    env_file: ./secrets/bbgo.env
    volumes:
      - bbgo-data:/data
      - ./bbgo-config:/config:ro
    networks:
      - bbgo-net

volumes:
  agent-a-data:
  agent-b-data:
  bbgo-data:

# One bridge network per agent, so the agents cannot reach each other.
# MTU 1460 matches the GCE VPC default; Docker's 1500 can stall large TLS
# transfers when path-MTU discovery is blocked upstream.
networks:
  agent-a-net: &net
    driver_opts:
      com.docker.network.driver.mtu: "1460"
  agent-b-net: *net
  bbgo-net: *net
